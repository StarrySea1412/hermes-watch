# 演示 fleet：3 个带 SSH 的"云服务器"容器，预埋不同病症
# 用法：docker compose up -d
# 公钥默认取 ~/.ssh/id_ed25519.pub（在 .env 里设置 PUBLIC_KEY）

x-ssh-base: &ssh-base
  image: linuxserver/openssh-server:latest
  environment:
    - PUID=1000
    - PGID=1000
    - PASSWORD_ACCESS=false
    - USER_NAME=root
    - PUBLIC_KEY=${PUBLIC_KEY:?请在 .env 中设置 PUBLIC_KEY}
  restart: unless-stopped

services:
  web-1:
    <<: *ssh-base
    container_name: demo-web-1
    ports: ["2221:2222"]

  db-1:
    <<: *ssh-base
    container_name: demo-db-1
    ports: ["2222:2222"]
    # 病症：磁盘填充器，每小时往 /var/log 写 200MB
    command: >
      sh -c "(while true; do dd if=/dev/zero of=/var/log/filler.bin bs=1M count=200 2>/dev/null; sleep 3600; done) &
             exec /init"

  app-1:
    <<: *ssh-base
    container_name: demo-app-1
    ports: ["2223:2222"]
    # 病症：内存泄漏进程，每 10 秒吃 10MB 不释放
    command: >
      sh -c "(python3 -c "
      import time,bytearray
      leak=bytearray()
      while True:
          leak+=bytearray(10*1024*1024)
          time.sleep(10)
      " &) 2>/dev/null; exec /init"
