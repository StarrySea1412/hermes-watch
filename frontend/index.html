<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1c" />
    <meta name="description" content="AI 服务器巡检与可视化平台：自动巡检、根因诊断、健康报告，全程数据本地" />
    <title>Hermes Watch · AI 服务器巡检</title>
    <script>
      // 防FOUC：React 挂载前先按 localStorage / 系统偏好上主题 class（与 next-themes 约定一致）
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t || t === 'system') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
        } catch (e) { document.documentElement.classList.add('dark'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 液态玻璃折射滤镜：feDisplacementMap 让 backdrop 真实扭曲（Chromium 支持 url() 滤镜，
         Safari/Firefox 解析失败自动回退 CSS 里的标准 blur 链） -->
    <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
      <filter id="hw-glass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.011" numOctaves="2" seed="11" result="n"/>
        <feGaussianBlur in="n" stdDeviation="3" result="nb"/>
        <feDisplacementMap in="SourceGraphic" in2="nb" scale="36" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
