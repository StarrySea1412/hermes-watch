<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1c" />
    <meta name="description" content="AI 服务器巡检与可视化平台：自动巡检、根因诊断、健康报告，全程数据本地" />
    <title>Hermes Watch · AI 服务器巡检</title>
    <script>
      // 防FOUC：React 挂载前先按 localStorage / 系统偏好上主题 class（与 next-themes 约定一致）
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t || t === 'system') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
        } catch (e) { document.documentElement.classList.add('dark'); }
        try {
          // 液态玻璃一键关闭：挂载前先挂 class，避免玻璃→实底闪变
          if (localStorage.getItem('hw_glass') === 'off') {
            document.documentElement.classList.add('glass-off');
          }
        } catch (e) { /* noop */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 液态玻璃折射滤镜（iOS 式）：折射集中在边缘环（::before + 环形 mask 承载），
         表面保持纯净磨砂——全表面噪声位移是「假折射」根源，已弃用。
         高频大位移 + 轻内模糊 = 棱上清晰液态弯曲。不支持 url() 的引擎自动回退纯磨砂 -->
    <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
      <filter id="hw-glass" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.02 0.02" numOctaves="2" seed="7" result="n"/>
        <feGaussianBlur in="n" stdDeviation="1" result="nb"/>
        <feDisplacementMap in="SourceGraphic" in2="nb" scale="90" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
